<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>MATA KEDUA Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: the run as a lane on the left; the screen being shown (operator console, guard's phone, engineers' library) on the right.
   World: Malaysian road signs and road paint. Sign colours carry status and actions only: red = Hold, yellow + box-junction hatch = locked or
   waiting, blue = route and actions, green = clear or done. Light only, by the user's choice: the page is read on a judge's laptop in daylight. */
:root {
  --ground: #EEF0EF; --face: #FFFFFF; --tint: #F6F7F6; --ink: #1D2228; --ink-2: #4B535C; --ink-3: #69717A; --rule: #D6DADC; --rule-2: #E7EAEB;
  --red: #C8102E; --red-ink: #A50D26; --red-face: #FCEBEE;
  --yellow: #FFC20E; --yellow-ink: #7A5200; --yellow-face: #FFF5D1;
  --blue: #005BAC; --blue-ink: #004A8C; --blue-face: #E6F0F9;
  --green: #00843D; --green-ink: #006B32; --green-face: #E3F3EA;
  --on-sign: #FFFFFF; --red-hover: #B00E28; --red-deep: #7E0A1D;
  /* drawings: daylight road scenes */
  --d-sky: #DCE6EC; --d-field: #E4E8E3; --d-pave: #D6DAD8; --d-kerb: #B3B9B7; --d-road: #6C7379; --d-mark: #FFFFFF; --d-nopark: #F2B705;
  --d-car: #9AA2A9; --d-car2: #39414A; --d-car3: #C4C9CD; --d-glass: #252C33; --d-tail: #C8102E; --d-van: #FFFFFF; --d-van-line: #1D2228;
  --d-person: #3E4751; --d-vest: #B9CB00; --d-truck: #5D8566; --d-fence: #8C959C; --d-map: #F4F5F4; --d-map-road: #C3C9CD; --d-hot: #D99A00;
  --shadow: 0 1px 2px rgba(29, 34, 40, .06), 0 8px 24px -12px rgba(29, 34, 40, .22);
  --f-ui: "Barlow", "Segoe UI", system-ui, sans-serif;
  --f-sign: "Barlow Semi Condensed", "Barlow", "Segoe UI", system-ui, sans-serif;
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --dash-v: linear-gradient(to bottom, var(--d-mark) 0 7px, transparent 7px 15px);
  --dbl-yellow: linear-gradient(var(--d-nopark), var(--d-nopark)) left 0 bottom 5px / 100% 2px no-repeat, linear-gradient(var(--d-nopark), var(--d-nopark)) left 0 bottom 0 / 100% 2px no-repeat;
  --give-way: repeating-linear-gradient(to right, var(--ink) 0 9px, transparent 9px 15px) left 0 top 0 / 100% 2px no-repeat, repeating-linear-gradient(to right, var(--ink) 0 9px, transparent 9px 15px) left 0 top 5px / 100% 2px no-repeat;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { background: var(--ground); color: var(--ink); }
body { font: 400 16px/1.5 var(--f-ui); margin: 0; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
h1, h2, h3 { text-wrap: balance; }
.num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.i { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.i.fillme { fill: currentColor; stroke: none; }
.wrap { max-width: 1480px; margin: 0 auto; padding-block: 18px 32px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* ---------- header ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 18px; padding-bottom: 16px; }
.nameplate { margin: 0; background: var(--blue); color: var(--on-sign); font: 700 21px/1 var(--f-sign); letter-spacing: .07em; padding: 11px 16px 10px;
  border-radius: 8px; box-shadow: inset 0 0 0 3px var(--blue), inset 0 0 0 4.5px var(--on-sign), 0 1px 2px rgba(29, 34, 40, .12); }
.ident { display: grid; gap: 1px; min-width: 0; flex: 1 1 260px; }
.ident p { margin: 0; }
.ident .what { font-weight: 600; font-size: 16px; }
.ident .team { font-size: 14px; color: var(--ink-2); }
.seg { display: inline-flex; background: var(--face); border: 1px solid var(--rule); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; border-radius: 7px; padding: 7px 13px; font-weight: 600; font-size: 14.5px; color: var(--ink-2);
  transition: background-color .2s var(--ease-out), color .2s var(--ease-out); }
.seg button:hover { color: var(--ink); background: var(--tint); }
.seg button[aria-pressed="true"] { background: var(--blue); color: var(--on-sign); }
.lang button { padding: 6px 11px; font-family: var(--f-sign); letter-spacing: .05em; }

/* ---------- stage ---------- */
.stage { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 28px; align-items: start; }
.guide { display: grid; gap: 14px; min-width: 0; }
@media (min-width: 901px) { .guide { position: sticky; top: calc(14px + env(safe-area-inset-top, 0px)); } }
.lead { margin: 0; font-size: 16px; color: var(--ink); max-width: 62ch; }
.guide h2, .guide h3 { margin: 6px 0 0; font: 700 13px/1.3 var(--f-sign); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.guide h3 { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
.small { margin: 0; font-size: 13.5px; color: var(--ink-2); max-width: 62ch; }

/* the run as a lane of road: asphalt with white edge lines and a dashed centre line; each stop is a white stop line;
   blue marks the distance travelled; the current stop is a blue plate */
.lane { list-style: none; margin: 0; padding: 0; position: relative; }
.lane::before, .lane::after { content: ""; position: absolute; top: 6px; bottom: 6px; }
.lane::before { left: 7px; width: 26px; border-radius: 3px;
  background: linear-gradient(to right, transparent 3px, var(--d-mark) 3px 4.5px, transparent 4.5px 21.5px, var(--d-mark) 21.5px 23px, transparent 23px),
    linear-gradient(to bottom, var(--d-mark) 0 7px, transparent 7px 15px) center top / 2px 15px repeat-y, var(--d-road); }
.lane::after { left: 17px; width: 6px; background: var(--blue); transform-origin: top center; transform: scaleY(var(--k, 0)); transition: transform .7s var(--ease-out); }
.lane button { position: relative; display: block; width: 100%; border: 0; background: transparent; text-align: left; padding: 4px 0 4px 44px; }
.lane button::before { content: ""; position: absolute; z-index: 1; left: 10px; top: 21.5px; width: 20px; height: 4px; border-radius: 1px; background: var(--d-mark); }
.lane button[aria-current="step"]::before { left: 11px; top: 14.5px; width: 18px; height: 18px; border-radius: 3px; background: var(--blue);
  box-shadow: inset 0 0 0 2px var(--blue), inset 0 0 0 3.5px var(--on-sign), 0 0 0 2px var(--d-road); }
.lane .face { display: grid; grid-template-columns: 62px minmax(0, 1fr); column-gap: 8px; padding: 9px 12px; border-radius: 6px; transition: background-color .25s var(--ease-out); }
.lane button:hover .face { background: rgba(255, 255, 255, .65); }
.lane button[aria-current="step"] .face { background: var(--face); box-shadow: inset 0 0 0 3px var(--face), inset 0 0 0 4.5px var(--ink); }
.lane time { font: 600 13.5px/1.55 var(--f-sign); color: var(--ink-2); letter-spacing: .02em; }
.lane button[aria-current="step"] time { color: var(--blue-ink); }
.lane strong { display: block; font-size: 15px; font-weight: 600; line-height: 1.35; }
.lane .more { grid-column: 2; display: grid; grid-template-rows: 0fr; transition: grid-template-rows .45s var(--ease-out); }
.lane .more > span { overflow: hidden; font-size: 14px; line-height: 1.45; color: var(--ink-2); }
.lane button[aria-current="step"] .more { grid-template-rows: 1fr; }
.lane button[aria-current="step"] .more > span { padding-top: 3px; }

/* ---------- demo column ---------- */
.demo { min-width: 0; display: grid; gap: 12px; }
.viewbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 14px; }
.runctl { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.runbtn { display: inline-flex; align-items: center; gap: 8px; border: 1.5px solid var(--ink); background: var(--face); border-radius: 9px; padding: 8px 14px 8px 11px;
  font-weight: 600; font-size: 14.5px; transition: background-color .2s var(--ease-out); }
.runbtn:hover { background: var(--tint); }
.runbtn .i { width: 16px; height: 16px; }
.hint { margin: 0; font-size: 14px; color: var(--ink-2); }
.screen { min-width: 0; }
.sign { background: var(--face); border-radius: 6px; box-shadow: 0 0 0 1px var(--rule), inset 0 0 0 4px var(--face), inset 0 0 0 5.5px var(--ink); }
.caption { position: relative; padding: 15px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; overflow: hidden; }
.meter { position: absolute; left: 8px; right: 8px; top: 8px; height: 3px; background: var(--blue); transform-origin: left center; transform: scaleX(0); opacity: 0; }
.meter.run { opacity: 1; animation: meter var(--dur, 7500ms) linear both; }
@keyframes meter { from { transform: scaleX(0); } to { transform: scaleX(1); } }
.stepplate { flex: none; font: 700 13px/1 var(--f-sign); letter-spacing: .06em; text-transform: uppercase; color: var(--blue-ink); background: var(--blue-face); padding: 6px 9px; border-radius: 5px; }
.caption p { margin: 0; flex: 1 1 300px; min-width: 0; font-size: 15.5px; }
.ctl { display: flex; gap: 8px; }
.ctl button { border: 1.5px solid var(--ink); background: var(--face); border-radius: 9px; padding: 8px 16px; font-weight: 600; transition: background-color .2s var(--ease-out), opacity .2s; }
.ctl button:hover { background: var(--tint); }
.ctl #nextBtn { background: var(--blue); border-color: var(--blue); color: var(--on-sign); }
.ctl #nextBtn:hover { background: var(--blue-ink); }
.ctl button:disabled { opacity: .35; cursor: default; }
.foot { margin-top: 28px; padding-top: 14px; border-top: 1px solid var(--rule); font-size: 13.5px; color: var(--ink-2); display: grid; gap: 4px; }
.foot p { margin: 0; max-width: 100ch; }
.foot strong { color: var(--ink); font-weight: 600; }

/* ---------- operator console ---------- */
.console { padding: 8px; font-size: 14.5px; }
.cbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 6px 16px; padding: 9px 10px 16px; background: var(--dbl-yellow); }
.cname { display: flex; flex-wrap: wrap; gap: 2px 10px; align-items: baseline; }
.cname b { font-weight: 700; font-size: 15px; }
.cname span { color: var(--ink-2); font-size: 14px; }
.cright { display: flex; align-items: center; gap: 12px; }
.simtag { font: 700 11.5px/1 var(--f-sign); letter-spacing: .1em; color: var(--ink); background: var(--yellow); padding: 5px 8px 4px; border-radius: 4px;
  box-shadow: inset 0 0 0 2px var(--yellow), inset 0 0 0 3px var(--ink); }
.clock { font: 700 16px/1 var(--f-sign); letter-spacing: .03em; }
.opid { font: 600 13px/1 var(--f-sign); color: var(--ink-2); letter-spacing: .05em; }
.vstat { display: flex; flex-wrap: wrap; gap: 4px 18px; padding: 7px 10px; background: var(--tint); color: var(--ink-2); font-size: 13.5px; }
.vstat b { color: var(--ink); font-weight: 700; }
/* the console's columns are separated by roads: the grid gaps show asphalt with a dashed centre line */
.cgrid { display: grid; grid-template-columns: 200px minmax(0, 1fr) 304px; grid-template-rows: auto 1fr; grid-template-areas: "queue main req" "queue more req"; column-gap: 12px;
  background: var(--dash-v) left 205px top 0 / 2px 15px repeat-y, var(--dash-v) right 309px top 0 / 2px 15px repeat-y, var(--d-road); }
.queue, .req { padding: 14px 12px; min-width: 0; background: var(--face); }
.queue { grid-area: queue; display: grid; gap: 12px; align-content: start; }
.req { grid-area: req; display: flex; flex-direction: column; gap: 11px; }
.h { margin: 0; font: 700 12.5px/1.3 var(--f-sign); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); }
.quiet { margin: 0; color: var(--ink-2); font-size: 14px; }
.qitem { display: grid; gap: 6px; justify-items: start; }
.qwhere { font-weight: 600; font-size: 14px; }
.qwait { color: var(--ink-2); font-size: 13.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 700 12.5px/1 var(--f-sign); letter-spacing: .05em; text-transform: uppercase; padding: 6px 8px 5px; border-radius: 4px; }
.chip .i { width: 13px; height: 13px; }
.chip.hold { background: var(--red); color: var(--on-sign); }
.chip.wait { background: var(--yellow); color: var(--ink); }
.chip.ok { background: var(--green); color: var(--on-sign); }
.hotsign { background: var(--blue); color: var(--on-sign); border-radius: 9px; padding: 11px 12px 12px; box-shadow: inset 0 0 0 3px var(--blue), inset 0 0 0 4.5px var(--on-sign); }
.hotsign p { margin: 0 0 8px; font: 700 12px/1.3 var(--f-sign); letter-spacing: .09em; text-transform: uppercase; }
.hotsign ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 7px; }
.hotsign li { display: grid; gap: 0; font-size: 13.5px; line-height: 1.3; }
.hotsign .num { font: 600 13px/1.3 var(--f-sign); opacity: .9; letter-spacing: .03em; }
.tone-hold { color: var(--red-ink); } .tone-wait { color: var(--yellow-ink); } .tone-ok { color: var(--green-ink); }

.cams { padding: 14px 12px; display: grid; gap: 10px; align-content: start; min-width: 0; background: var(--tint); }
.cams.main { grid-area: main; padding-bottom: 0; }
.cams.more { grid-area: more; padding-top: 10px; }
.pair { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr); gap: 10px; align-items: start; }
.trio { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.mq { display: none; }
.tile { position: relative; background: var(--d-sky); border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; }
.tile svg { display: block; width: 100%; height: auto; }
.lbl, .lbl2 { position: absolute; font: 700 11px/1 var(--f-sign); letter-spacing: .08em; padding: 4px 6px 3px; border-radius: 3px; }
.lbl { left: 7px; top: 7px; color: var(--on-sign); background: rgba(29, 34, 40, .82); }
.lbl2 { right: 7px; bottom: 7px; color: var(--ink); background: rgba(255, 255, 255, .88); text-transform: uppercase; }
.tile.gate .lbl { background: var(--blue); }
.tile.gate.alert { border-color: var(--red); box-shadow: 0 0 0 1px var(--red); }
.tile.off { display: grid; place-items: center; min-height: 150px; background: var(--face); border-style: dashed; color: var(--ink-2); font-size: 14px; text-align: center; padding: 18px; }
.frozen { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(255, 245, 209, .9); color: var(--yellow-ink); font-weight: 700; font-size: 15px; text-align: center; padding: 8px; }
.log { padding: 4px 2px 0; display: grid; gap: 4px; font-size: 13.5px; }
.log div { display: grid; grid-template-columns: 66px minmax(0, 1fr); gap: 8px; }
.log .num { font: 600 13px/1.5 var(--f-sign); color: var(--ink-2); letter-spacing: .02em; }
.ask { margin: 0; font-size: 19px; line-height: 1.3; font-weight: 600; }
.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; font-size: 13.5px; margin: 0; }
.kv dt { color: var(--ink-2); }
.kv dd { margin: 0; font-weight: 500; }
.map { border-radius: 4px; overflow: hidden; background: var(--d-map); }
.map svg { display: block; width: 100%; height: auto; }
.state { display: flex; gap: 8px; align-items: flex-start; margin: 0; font-size: 14px; padding: 9px 10px; border-radius: 8px; background: var(--tint); }
.state .i { width: 16px; height: 16px; margin-top: 2px; }
.state.hold { background: var(--red-face); color: var(--red-ink); }
.state.wait { background: var(--yellow-face); color: var(--yellow-ink); }
.state.ok { background: var(--green-face); color: var(--green-ink); }
.state.plain { background: var(--blue-face); color: var(--blue-ink); }
.ctx { width: 100%; border: 1.5px solid var(--ink); background: var(--face); border-radius: 9px; padding: 10px; font-weight: 600; transition: background-color .2s var(--ease-out); }
.ctx:hover { background: var(--tint); }
.labels { display: grid; gap: 5px; font-size: 14px; }
.labels label { display: flex; gap: 8px; align-items: center; }
.labels input { width: 16px; height: 16px; accent-color: var(--blue); }

/* the action bar: Hold is a red plate; Go and Set path sit inside a yellow box junction until the way is clear */
.bar { margin-top: auto; display: grid; gap: 8px; padding-top: 17px; background: var(--give-way); }
.hold { --plate: var(--red); display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 56px; border: 0; border-radius: 6px; background: var(--plate); color: var(--on-sign);
  box-shadow: inset 0 0 0 3px var(--plate), inset 0 0 0 4.5px var(--on-sign); font-weight: 700; font-size: 18px; letter-spacing: .02em; transition: background-color .25s var(--ease-out), box-shadow .25s var(--ease-out), transform .12s; }
.hold:hover { --plate: var(--red-hover); }
.hold[aria-pressed="true"] { --plate: var(--red-deep); }
.hold .i { width: 20px; height: 20px; }
.hold:active, .move:active { transform: scale(.985); }
.moves { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.move { position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; border: 2px solid transparent; border-radius: 9px;
  color: var(--on-sign); font-weight: 700; font-size: 16px; transition: transform .12s, background-color .25s; }
.move span, .move .i { position: relative; z-index: 1; }
.move.go { background: var(--green); }
.move.path { background: var(--blue); }
.move.go:hover { background: var(--green-ink); }
.move.path:hover { background: var(--blue-ink); }
.move[aria-disabled="true"] { background: var(--d-road); color: var(--ink); border-color: var(--yellow); cursor: not-allowed; }
.move[aria-disabled="true"]::after, .moves.clearing .move::after { content: ""; position: absolute; inset: 0; z-index: 0;
  background: repeating-linear-gradient(45deg, var(--yellow) 0 2.5px, transparent 2.5px 11px), repeating-linear-gradient(-45deg, var(--yellow) 0 2.5px, transparent 2.5px 11px); }
.move[aria-disabled="true"] span { background: var(--face); padding: 1px 7px; border-radius: 4px; }
.move[aria-disabled="true"] .i { background: var(--face); border-radius: 4px; padding: 2px; width: 22px; height: 22px; }
.lockwhy { display: flex; gap: 7px; align-items: flex-start; margin: 0; font-size: 13.5px; color: var(--yellow-ink); font-weight: 500; }
.lockwhy .i { width: 15px; height: 15px; margin-top: 2px; }
.note { margin: 0; font-size: 13.5px; padding: 8px 10px; border-radius: 8px; background: var(--yellow-face); color: var(--yellow-ink); }

/* drawing classes */
.sky { fill: var(--d-sky); } .field { fill: var(--d-field); } .pave { fill: var(--d-pave); } .road { fill: var(--d-road); } .mark { fill: var(--d-mark); } .kerb { fill: var(--d-kerb); }
.nopark { fill: var(--d-nopark); } .car { fill: var(--d-car); } .car2 { fill: var(--d-car2); } .car3 { fill: var(--d-car3); } .glass { fill: var(--d-glass); } .tl { fill: var(--d-tail); }
.van { fill: var(--d-van); stroke: var(--d-van-line); stroke-width: .8; } .vantxt { fill: var(--d-van-line); font: 700 9px var(--f-sign); } .truck { fill: var(--d-truck); }
.person { fill: var(--d-person); } .vest { fill: var(--d-vest); } .fence { stroke: var(--d-fence); stroke-width: 1; fill: none; }
.hot { fill: none; stroke: var(--d-hot); stroke-width: 1.4; stroke-dasharray: 4 3; }
.path { fill: none; stroke: var(--blue); stroke-width: 2.6; stroke-linecap: round; stroke-dasharray: 7 5; }
.ptxt { fill: var(--ink-2); font: 600 10px var(--f-sign); letter-spacing: .04em; }
.mground { fill: var(--d-map); } .mroad { fill: var(--d-map-road); } .mcar { fill: #8E979E; }
.det { fill: none; stroke: var(--red); stroke-width: 1.6; } .detbg { fill: var(--red); } .dett { fill: var(--on-sign); font: 700 9px var(--f-sign); letter-spacing: .03em; }

/* ---------- guard phone: always light; it is read outdoors ---------- */
.phone { width: min(100%, 380px); margin: 0 auto; border: 10px solid var(--ink); border-radius: 38px; background: var(--face); color: var(--ink); overflow: hidden; box-shadow: var(--shadow); }
.pstat { display: flex; justify-content: space-between; align-items: center; padding: 9px 20px 4px; font: 700 13.5px/1 var(--f-sign); }
.pstat .icons { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }
.pstat svg { height: 10px; width: auto; fill: currentColor; }
.papp { padding: 12px 18px 22px; display: flex; flex-direction: column; gap: 14px; min-height: 620px; }
.papp header { display: grid; gap: 2px; border-bottom: 1px solid var(--rule); padding-bottom: 12px; }
.papp header b { font-size: 19px; font-weight: 700; }
.papp header span { color: var(--ink-2); font-size: 14.5px; }
.pcard { border: 1px solid var(--rule); border-radius: 12px; padding: 15px; display: grid; gap: 7px; }
.pcard.wait { border: 2px solid var(--yellow); background: var(--yellow-face); }
.pcard.ok { border: 2px solid var(--green); background: var(--green-face); }
.pcard h3 { margin: 0; font-size: 20px; line-height: 1.25; font-weight: 700; display: flex; gap: 9px; align-items: flex-start; }
.pcard h3 .i { width: 22px; height: 22px; margin-top: 1px; }
.pcard.wait h3 .i { color: var(--yellow-ink); } .pcard.ok h3 .i { color: var(--green-ink); }
.pcard p { margin: 0; font-size: 16px; color: var(--ink-2); }
.pbtns { margin-top: auto; display: grid; gap: 10px; }
.big { position: relative; overflow: hidden; min-height: 66px; border: 2px solid var(--ink); border-radius: 12px; background: var(--face); color: var(--ink); font-size: 19px; font-weight: 700; touch-action: none; user-select: none; }
.big.clearbtn { border-color: var(--green); color: var(--green-ink); }
.big small { display: block; font-size: 13.5px; font-weight: 500; color: var(--ink-2); }
.big .fill { position: absolute; inset: 0; transform: scaleX(0); transform-origin: left center; background: var(--green); z-index: 0; }
.big span { position: relative; z-index: 1; }
.big.holding .fill { transform: scaleX(1); transition: transform 1s linear; }
.big.holding span, .big.holding small { color: var(--on-sign); transition: color .2s .45s; }

/* ---------- engineers' library ---------- */
.lib { padding: 8px; }
.libbar { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; justify-content: space-between; padding: 9px 10px 16px; background: var(--dbl-yellow); }
.libbar b { font-size: 16px; font-weight: 700; }
.libbar span { font-size: 14px; color: var(--ink-2); }
.libbody { padding: 14px 10px 10px; display: grid; gap: 12px; }
.sum { margin: 0; font-size: 14.5px; color: var(--ink-2); }
.sum b { color: var(--ink); font-weight: 700; }
.filter { display: flex; gap: 8px; align-items: center; font-size: 14.5px; }
.filter select { font: inherit; padding: 6px 10px; border: 1px solid var(--rule); border-radius: 8px; background: var(--face); color: var(--ink); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; min-width: 780px; font-size: 14.5px; }
th { text-align: left; font: 700 12px/1.3 var(--f-sign); letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); border-bottom: 2px solid var(--ink); padding: 7px 8px; white-space: nowrap; }
td { border-bottom: 1px solid var(--rule); padding: 10px 8px; vertical-align: top; }
td.when, td.took { white-space: nowrap; }
td.when .num { display: block; font-weight: 600; }
td.when small { font: 600 12px/1.4 var(--f-sign); color: var(--ink-3); letter-spacing: .03em; }
tr.new td { background: var(--blue-face); }
.dec { display: grid; gap: 4px; justify-items: start; }
.dec .why { font-size: 13.5px; color: var(--ink-2); }
.lv { font: 700 11.5px/1 var(--f-sign); letter-spacing: .07em; text-transform: uppercase; padding: 4px 6px 3px; border-radius: 3px; }
.lv-h { background: var(--red); color: var(--on-sign); } .lv-w { background: var(--yellow); color: var(--ink); } .lv-o { background: var(--rule-2); color: var(--ink-2); }
.clipbtn { border: 1.5px solid var(--ink); background: var(--face); border-radius: 7px; padding: 5px 9px; font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.clipbtn:hover { background: var(--tint); }
.cliprow td { background: var(--tint); }
.clip { display: grid; grid-template-columns: minmax(0, 280px) minmax(0, 1fr); gap: 14px; align-items: start; font-size: 14px; color: var(--ink-2); }
.clip p { margin: 0; max-width: 60ch; }

/* #shot-stepN: the screen alone, for deck screenshots */
.shotmode .top, .shotmode .guide, .shotmode .viewbar, .shotmode .caption, .shotmode .foot { display: none; }
.shotmode .stage { display: block; }
.shotmode .wrap { max-width: none; padding: 14px; }
.shotmode .phone { box-shadow: none; }

/* ---------- motion ---------- */
::view-transition-group(root) { animation-duration: .32s; animation-timing-function: var(--ease-out); }
@media (prefers-reduced-motion: no-preference) {
  .moves.clearing .move::after { animation: boxclear .9s var(--ease-out) .2s both; }
  @keyframes boxclear { from { clip-path: inset(0 0 0 0); } to { clip-path: inset(0 0 0 100%); } }
  .moves.nudge { animation: nudge .32s ease-in-out; }
  @keyframes nudge { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .tile.gate.alert { animation: alert 1.4s ease-in-out 2; }
  @keyframes alert { 50% { box-shadow: 0 0 0 4px rgba(200, 16, 46, .28); } }
}
@media (prefers-reduced-motion: reduce) {
  .moves.clearing .move::after { content: none; }
  .lane::after, .lane .more, .lane button::before { transition: none; }
  .big.holding .fill { transition: none; }
  ::view-transition-group(root) { animation: none; }
}

/* ---------- narrow screens ---------- */
@media (max-width: 1180px) {
  .cgrid { grid-template-columns: minmax(0, 1fr) 290px; grid-template-rows: auto auto 1fr; grid-template-areas: "queue queue" "main req" "more req";
    background: var(--dash-v) right 295px top 0 / 2px 15px repeat-y, var(--d-road); }
  .queue { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: flex-start; padding-bottom: 19px; background: var(--dbl-yellow), var(--face); }
  .queue .h { flex-basis: 100%; }
  .hotsign ul { grid-auto-flow: column; gap: 4px 18px; }
}
@media (max-width: 900px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .demo { order: -1; }
}
@media (max-width: 720px) {
  .cgrid { grid-template-columns: minmax(0, 1fr); grid-template-rows: none; grid-template-areas: "main" "req" "more" "queue"; background: none; }
  .queue { padding-bottom: 14px; background: var(--face); }
  .req .bar { order: -1; margin-top: 0; padding-top: 0; padding-bottom: 17px; background: repeating-linear-gradient(to right, var(--ink) 0 9px, transparent 9px 15px) left 0 bottom 0 / 100% 2px no-repeat, repeating-linear-gradient(to right, var(--ink) 0 9px, transparent 9px 15px) left 0 bottom 5px / 100% 2px no-repeat; }
  .pair { grid-template-columns: minmax(0, 1fr); }
  .pair .tile:first-child { order: 2; }
  .mq { display: block; margin: 0; font-weight: 600; font-size: 17px; line-height: 1.3; }
  .cgrid:has(.mq) .req .ask { display: none; } /* the question already sits above the cameras */
  .hotsign ul { grid-auto-flow: row; }
  .clip { grid-template-columns: minmax(0, 1fr); }
  .top { display: grid; grid-template-columns: minmax(0, 1fr) auto; }
  .nameplate { justify-self: start; }
  .ident { grid-column: 1 / -1; grid-row: 2; }
  .caption { position: sticky; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); z-index: 5; padding: 12px 13px; display: grid;
    grid-template-columns: auto minmax(0, 1fr) auto; grid-template-areas: "plate . ctl" "text text text"; gap: 6px 8px; }
  .stepplate { grid-area: plate; align-self: center; }
  .caption p { grid-area: text; font-size: 14px; line-height: 1.4; }
  .ctl { grid-area: ctl; }
  .ctl button { padding: 6px 13px; }
  .papp { min-height: 0; }
  .viewbar { flex-direction: column; align-items: stretch; }
  .views { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .views button { padding: 8px 4px; font-size: 13.5px; }
}
</style>

    const lock = peopleN ? t("lockPeople") : frozen ? t("lockFeed") : sc.req === "guard" ? t("lockGuard") : "";
    const isHeld = ["held", "guard", "frozen"].includes(sc.req) || S.held;
    const clearing = lastLock && !lock; /* the box junction clears the moment the way is clear */
    lastLock = lock;
    bar = `<div class="bar"><button class="hold" data-act="hold" aria-pressed="${isHeld}">${ico("oct", isHeld ? "fillme" : "")}<span>${esc(isHeld ? t("held2") : t("hold"))}</span></button>
      <div class="moves ${clearing ? "clearing" : ""} ${S.tried && lock ? "nudge" : ""}">
        <button class="move go" data-act="go" aria-disabled="${!!lock}">${ico(lock ? "lock" : "go")}<span>${esc(t("go"))}</span></button>
        <button class="move path" data-act="setpath" aria-disabled="${!!lock}">${ico(lock ? "lock" : "path")}<span>${esc(t("setPath"))}</span></button></div>
      ${lock ? `<p class="lockwhy">${ico("warn")}<span>${esc(lock)}</span></p>` : ""}${S.tried && lock ? `<p class="note" role="alert">${esc(t("tryLocked"))}</p>` : ""}</div>`;
  } else lastLock = null;
  const showPath = sc.req === "clear" || sc.req === "moving";
  return `<div class="console sign"><div class="cbar"><div class="cname"><b>${esc(t("roc"))}</b><span>${esc(t("route"))}</span></div>
      <div class="cright"><span class="simtag">${esc(t("sim"))}</span><span class="clock num" id="cclock">${clockNow()}</span><span class="opid">OP-02</span></div></div>
    <div class="vstat"><span><b>RV-01</b></span><span><b class="num">${sc.speed}</b> ${esc(t("vSpeed"))}</span>${sc.speed === 0 ? `<span class="tone-wait">${esc(t("vHaz"))}</span>` : ""}
      <span>${esc(t("vBatt"))} <b class="num">64%</b></span><span>${esc(t("vNet"))} <b class="num">5G SA · 38 ms</b></span></div>
    <div class="cgrid"><aside class="queue"><p class="h">${esc(t("qTitle"))}</p>${queue}${hot}</aside>
      <section class="cams main" aria-label="Cameras">${camsMain}</section><section class="cams more" aria-label="More cameras and log">${camsMore}</section>
      <aside class="req" aria-live="polite">${body}<div class="map">${mapSvg(sc, showPath)}</div>${ctx}${bar}</aside></div></div>`;
}

/* ---------- guard phone ---------- */
function renderGuard() {
  const sc = st();
  let card, btns = "";
  const pair = `<div class="pbtns"><button class="big" data-act="gwait"><span>${esc(t("gWaitB"))}</span></button>
      <button class="big clearbtn" id="gclear" data-hold="gclear"><i class="fill"></i><span>${esc(t("gClearB"))}<small>${esc(t("gClearHint"))}</small></span></button></div>`;
  if (sc.guard === "clear") card = `<div class="pcard ok"><h3>${ico("check")}<span>${esc(t("gSentClear"))}</span></h3><p>${esc(t("gSentClearP"))}</p></div>`;
  else if (sc.guard === "asked" && S.guardWait) { card = `<div class="pcard wait"><h3>${ico("warn")}<span>${esc(t("gSentWait")(S.guardWait))}</span></h3></div>`; btns = pair; }
  else if (sc.guard === "asked") { card = `<div class="pcard wait"><h3>${ico("warn")}<span>${esc(t("gReqH"))}</span></h3><p>${esc(t("gReqP"))}</p></div>`; btns = pair; }
  else card = `<div class="pcard"><h3><span>${esc(t("gIdle"))}</span></h3><p>${esc(t("gIdleP"))}</p></div>`;
  const tm = clockNow().slice(0, 5).replace(/^0/, "");
  return `<div class="phone"><div class="pstat"><span id="pclock" class="num">${tm}</span><span class="icons">
      <svg viewBox="0 0 18 11" aria-hidden="true"><rect x="0" y="7" width="3" height="4"/><rect x="5" y="5" width="3" height="6"/><rect x="10" y="2.5" width="3" height="8.5"/><rect x="15" y="0" width="3" height="11"/></svg>5G
      <svg viewBox="0 0 24 11" aria-hidden="true"><rect x=".5" y=".5" width="20" height="10" rx="2" fill="none" stroke="currentColor"/><rect x="2" y="2" width="13" height="7" rx="1"/><rect x="21.5" y="3.5" width="2" height="4" rx="1"/></svg>71%</span></div>
    <div class="papp"><header><b>${esc(t("gApp"))}</b><span>${esc(t("gSub"))}</span></header>${card}${btns}</div></div>`;
}

/* ---------- engineers' library ---------- */
const ROWS = [ /* simulated. lvl h = needs review (held for a hidden person, path refused, long), w = check, o = routine */
  { id: "AS-1102-0714", new: true, when: ["Isn 2 Nov 07:14", "Mon 2 Nov 07:14"], place: "gateName", dec: ["Tahan, kemudian laluan kanan", "Hold, then path right"],
    why: ["2 orang tersembunyi, nampak di kamera pintu", "2 people hidden, seen on the gate camera"], took: "38 s", lvl: "h", clip: true },
  { id: "AS-1030-1741", when: ["Jum 30 Okt 17:41", "Fri 30 Oct 17:41"], place: ["Persiaran Rimba Permai (lembah)", "Persiaran Rimba Permai (dip)"],
    labels: ["air bertakung", "standing water"], dec: ["Tahan, lencongan", "Hold, detour"], why: ["paras air tidak jelas dari kamera van", "water depth unclear from the van's cameras"], took: "2 min 10 s", lvl: "h", clip: true },
  { id: "AS-1029-1022", when: ["Kha 29 Okt 10:22", "Thu 29 Oct 10:22"], place: "apec", labels: ["kon kerja jalan", "road-work cones"],
    dec: ["Laluan ditolak oleh van", "Path refused by the van"], why: ["sensor van nampak kon yang terlindung", "the van's sensors saw a hidden cone"], took: "48 s", lvl: "h", clip: true },
  { id: "AS-1102-0658", when: ["Isn 2 Nov 06:58", "Mon 2 Nov 06:58"], place: "rimba", labels: ["isyarat tangan polis", "police hand signals"],
    dec: ["Teruskan ikut isyarat", "Go on the officer's signal"], why: ["", ""], took: "22 s", lvl: "w", clip: true },
  { id: "AS-1029-0731", when: ["Kha 29 Okt 07:31", "Thu 29 Oct 07:31"], place: "gateName", labels: ["video beku", "video froze"],
    dec: ["Tahan, pasukan darat", "Hold, ground team"], why: ["", ""], took: "3 min 05 s", lvl: "w", clip: false },
  { id: "AS-1030-1205", when: ["Jum 30 Okt 12:05", "Fri 30 Oct 12:05"], place: "mrt", labels: ["pejalan kaki ramai", "crowded crossing"],
    dec: ["Teruskan", "Go"], why: ["", ""], took: "18 s", lvl: "o", clip: true },
  { id: "AS-1030-0802", when: ["Jum 30 Okt 08:02", "Fri 30 Oct 08:02"], place: ["Persiaran Cyber Point Selatan", "Persiaran Cyber Point Selatan"], labels: ["motosikal mencelah", "motorcycles filtering"],
    dec: ["Diselesaikan oleh van", "Resolved by van"], why: ["", ""], took: "—", lvl: "o", clip: false },
];
function renderLibrary() {
  const L = S.lang === "bm" ? 0 : 1;
  const showNew = S.step >= 8;
  const rows = ROWS.filter((r) => (!r.new || showNew) && (S.filter === "all" || r.lvl !== "o"));
  const place = (p) => (typeof p === "string" ? t(p) : p[L]);
  const labels = (r) => (r.new ? t("labelSet").filter((_, i) => S.labels[i]).join(" · ") : r.labels[L]);
  const tr = rows.map((r) => {
    const open = S.clip === r.id;
    const main = `<tr class="${r.new && S.step === 8 ? "new" : ""}"><td class="when"><span class="num">${esc(r.when[L])}</span><small class="num">${r.id}</small></td>
      <td><div class="dec"><span class="lv lv-${r.lvl}">${esc(t("lvl")[r.lvl])}</span><span>${esc(r.dec[L])}</span>${r.why[L] ? `<span class="why">${esc(r.why[L])}</span>` : ""}</div></td>
      <td>${esc(place(r.place))}</td><td>${esc(labels(r))}</td><td class="num took">${esc(r.took)}</td>
      <td>${r.clip ? `<button class="clipbtn" data-act="clip:${r.id}" aria-expanded="${open}">${esc(open ? t("closeClip") : t("openClip"))}</button>` : esc(t("noclip"))}</td></tr>`;
    const detail = open ? `<tr class="cliprow"><td colspan="6"><div class="clip"><div class="tile">${camGate({ req: "held", kids: r.new ? "between" : "none", speed: 0 }, false)}</div>
      <p>${esc(t("clipNote"))}</p></div></td></tr>` : "";
    return main + detail;
  }).join("");
  return `<div class="lib sign"><div class="libbar"><b>${esc(t("libTitle"))}</b><span>${esc(t("libWho"))}</span></div>
    <div class="libbody"><p class="sum">${t("sum")(showNew ? 24 : 23, showNew ? 5 : 4)}</p>
    <label class="filter" for="flt">${esc(t("show"))} <select id="flt" data-change="filter"><option value="review" ${S.filter === "review" ? "selected" : ""}>${esc(t("fReview"))}</option>
      <option value="all" ${S.filter === "all" ? "selected" : ""}>${esc(t("fAll"))}</option></select></label>
    <div class="tablewrap"><table><thead><tr>${t("th").map((h) => `<th>${esc(h)}</th>`).join("")}</tr></thead><tbody>${tr}</tbody></table></div></div></div>`;
}

/* ---------- the run, drawn as a lane ---------- */
function buildWalk() {
  const item = (s, i) => `<li><button data-act="step:${i + 1}"><span class="face"><time class="num">${s.t}</time><strong>${esc(txt(s)[0])}</strong><span class="more"><span>${esc(txt(s)[1])}</span></span></span></button></li>`;
  $("#walkMain").innerHTML = STEPS.slice(0, DEMO_STEPS).map(item).join("");
  $("#walkSide").innerHTML = STEPS.slice(DEMO_STEPS).map((s, i) => item(s, i + DEMO_STEPS)).join("");
  builtLang = S.lang;
}
function updateWalk() {
  document.querySelectorAll(".lane button").forEach((b, i) => {
    const n = i + 1;
    b.toggleAttribute("aria-current", false);
    if (n === S.step) b.setAttribute("aria-current", "step");
    b.classList.toggle("done", S.step <= DEMO_STEPS ? n < S.step : n > DEMO_STEPS && n < S.step);
  });
  fillLanes();
  clearTimeout(fillTimer); fillTimer = setTimeout(fillLanes, 480); /* again once the previous step's description has folded away */
}
let fillTimer = null;
function fillLanes() { /* blue fills the lane up to the current stop */
  for (const lane of [$("#walkMain"), $("#walkSide")]) {
    const cur = lane.querySelector('[aria-current="step"]'), span = Math.max(1, lane.offsetHeight - 12);
    lane.style.setProperty("--k", cur ? Math.min(1, (cur.offsetTop + 17) / span).toFixed(4) : "0");
  }
}

/* ---------- page ---------- */
function render() {
  document.documentElement.lang = S.lang === "bm" ? "ms" : "en";
  if (builtLang !== S.lang) buildWalk();
  $("#sub").textContent = t("sub"); $("#team").textContent = t("team"); $("#lead").textContent = t("lead");
  $("#walkTitle").textContent = t("walkTitle"); $("#sideTitle").innerHTML = `${ico("fork")}<span>${esc(t("sideTitle"))}</span>`;
  $("#note").textContent = t("note");
  $("#foot1").innerHTML = t("foot1"); $("#foot2").textContent = t("foot2");
  $("#prevBtn").textContent = t("prev"); $("#nextBtn").textContent = t("next");
  $("#len").setAttribute("aria-pressed", String(S.lang === "en")); $("#lbm").setAttribute("aria-pressed", String(S.lang === "bm"));
  $("#seg").setAttribute("aria-label", t("viewas"));
  $("#seg").innerHTML = [["op", "vOp"], ["guard", "vGuard"], ["lib", "vLib"]].map(([v, k]) => `<button data-act="view:${v}" aria-pressed="${S.view === v}">${esc(t(k))}</button>`).join("");
  const label = playing ? t("pause") : S.step >= DEMO_STEPS ? t("replay") : t("play");
  $("#playMain").innerHTML = `${ico(playing ? "pause" : "play", "fillme")}<span>${esc(label)}</span>`;
  $("#hint").hidden = playing || !S.tookOver; $("#hint").textContent = t("hint");
  $("#screen").innerHTML = S.view === "op" ? renderConsole() : S.view === "guard" ? renderGuard() : renderLibrary();
  $("#stepNo").textContent = t("step")(S.step, STEPS.length);
  $("#cap").textContent = txt(st())[2];
  $("#prevBtn").disabled = S.step <= 1; $("#nextBtn").disabled = S.step >= STEPS.length;
  updateWalk();
}
/* Smooth swaps: the browser cross-fades only what changed between two renders. */
let booted = false; /* no transition on the first paint, or while the page is hidden */
function paint() { if (booted && document.startViewTransition && !reduced() && document.visibilityState === "visible") document.startViewTransition(render); else render(); }
function restartMeter() {
  const m = $("#meter");
  m.classList.remove("run");
  if (!playing || reduced()) return;
  void m.offsetWidth;
  m.style.setProperty("--dur", `${dwell(S.step)}ms`);
  m.classList.add("run");
}
function tick() {
  const set = (id, v) => { const el = $(id); if (el) el.textContent = v; };
  set("#cclock", clockNow()); set("#pclock", clockNow().slice(0, 5).replace(/^0/, "")); set("#wt", waited()); set("#wt2", waited());
}
function say(msg) { $("#announce").textContent = msg; }
function goStep(n) {
  Object.assign(S, { step: n, view: STEPS[n - 1].view, base: Date.now(), tried: false, done: false, held: false, guardWait: null, clip: null });
  paint(); restartMeter(); say(`${STEPS[n - 1].t}. ${txt(STEPS[n - 1])[0]}. ${txt(STEPS[n - 1])[1]}`);
}
function schedule() {
  clearTimeout(playTimer);
  if (playing) playTimer = setTimeout(() => { if (S.step >= DEMO_STEPS) { setPlaying(false); return; } goStep(S.step + 1); schedule(); }, dwell(S.step));
}
function setPlaying(on) {
  playing = on; clearTimeout(playTimer);
  if (on) {
    S.tookOver = false;
    if (S.step >= DEMO_STEPS) goStep(1);
    schedule();
  }
  render(); restartMeter();
}
function takeOver() { if (playing) { S.tookOver = true; setPlaying(false); } } /* any interaction hands control to the judge */
function locked(b) { return b.getAttribute("aria-disabled") === "true"; }
document.addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || b.disabled) return;
  const [act, arg] = b.dataset.act.split(":");
  const sc = st();
  if (!["play", "lang"].includes(act)) takeOver();
  switch (act) {
    case "play": setPlaying(!playing); return;
    case "prev": goStep(Math.max(1, S.step - 1)); return;
    case "next": goStep(Math.min(STEPS.length, S.step + 1)); return;
    case "step":
      goStep(+arg);
      if (matchMedia("(max-width: 900px)").matches) /* on phones the screen sits above the list */
        $("#screen").scrollIntoView({ block: "start", behavior: reduced() ? "auto" : "smooth" });
      return;
    case "lang": S.lang = arg; try { localStorage.setItem("mk-lang", arg); } catch (_) { /* remembered language is optional */ } paint(); return;
    case "view": S.view = arg; paint(); return;
    case "hold":
      if (sc.req === "asking") { goStep(3); return; }
      if (sc.req === "clear" || sc.req === "fa") { if (!S.held) S.held = stamp(2); paint(); say(t("heldState")); return; }
      say(t("alreadyHeld")); return;
    case "go":
    case "setpath":
      if (locked(b)) { S.tried = true; render(); say(t("tryLocked")); return; } /* a fresh render replays the nudge */
      if (sc.req === "clear") { goStep(7); return; }
      if (sc.req === "fa") { S.done = stamp(4); paint(); say(t("faClosed")); return; }
      return;
    case "askguard": goStep(4); return;
    case "gwait": S.guardWait = stamp(5); paint(); say(t("gSentWait")(S.guardWait)); return;
    case "close": goStep(8); return;
    case "ground": S.done = stamp(4); paint(); say(t("groundCalled")); return;
    case "clip": S.clip = S.clip === arg ? null : arg; paint(); return;
    default: return;
  }
});
/* "Clear" on the guard's phone needs a deliberate 1-second press; a keyboard press (no pointer) counts as deliberate. */
document.addEventListener("pointerdown", (e) => {
  const b = e.target.closest("[data-hold]");
  if (!b) return;
  takeOver();
  b.classList.add("holding");
  holdTimer = setTimeout(() => { holdTimer = null; goStep(5); }, reduced() ? 700 : 1000);
});
const cancelHold = () => { if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; document.querySelectorAll(".holding").forEach((b) => b.classList.remove("holding")); } };
document.addEventListener("pointerup", cancelHold);
document.addEventListener("pointercancel", cancelHold);
document.addEventListener("pointerleave", cancelHold);
document.addEventListener("click", (e) => { const b = e.target.closest("[data-hold]"); if (b && e.detail === 0) { takeOver(); goStep(5); } });
document.addEventListener("change", (e) => {
  takeOver();
  if (e.target.dataset.change === "filter") { S.filter = e.target.value; paint(); }
  if (e.target.dataset.label != null) { S.labels[+e.target.dataset.label] = e.target.checked; }
});
document.addEventListener("keydown", (e) => { /* arrow keys step through the run when focus isn't in a form control */
  if (e.altKey || e.ctrlKey || e.metaKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === "ArrowRight" && S.step < STEPS.length) { takeOver(); goStep(S.step + 1); }
  if (e.key === "ArrowLeft" && S.step > 1) { takeOver(); goStep(S.step - 1); }
});
addEventListener("resize", updateWalk);
try { const l = localStorage.getItem("mk-lang"); if (l === "en" || l === "bm") S.lang = l; } catch (_) { /* storage may be blocked */ }
const linked = /^#(shot-)?step(\d+)$/.exec(location.hash); /* #step6 opens that step, paused, for links from the deck */
if (linked && +linked[2] >= 1 && +linked[2] <= STEPS.length) { if (linked[1]) document.documentElement.classList.add("shotmode"); goStep(+linked[2]); }
else { render(); setPlaying(true); } /* otherwise the simulation starts on its own; any click hands control to the judge */
booted = true;
setInterval(tick, 1000);
document.fonts?.ready.then(updateWalk);
</script>
